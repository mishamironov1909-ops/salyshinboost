<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Бустики от Салюшина — рулетка">
<title>Бустики от Салюшина 🎰</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 15% 15%, rgba(0,255,220,.13), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(130,70,255,.16), transparent 35%),
        #070912;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .18;
    background-image:
        radial-gradient(circle, #fff 1px, transparent 1px);
    background-size: 35px 35px;
}

header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px 15px 10px;
}

.logo {
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(
        90deg,
        #00ffe1,
        #6e7cff,
        #d84cff
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.subtitle {
    margin-top: 8px;
    color: #aeb3c9;
    font-size: 16px;
}

.layout {
    position: relative;
    z-index: 2;

    width: min(1150px, 94%);
    margin: 25px auto 50px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 30px;
    align-items: start;
}

.game {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ==========================================
   CANVAS
========================================== */

.wheel-box {
    position: relative;
    width: min(580px, 94vw);
    aspect-ratio: 1;
}

#wheelCanvas {
    display: block;
    width: 100%;
    height: 100%;

    border-radius: 50%;

    filter:
        drop-shadow(0 0 20px rgba(0,255,220,.18))
        drop-shadow(0 25px 45px rgba(0,0,0,.5));
}

/* ==========================================
   УКАЗАТЕЛЬ
========================================== */

.pointer {
    position: absolute;
    z-index: 10;

    top: -2px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-top: 58px solid #fff;

    filter:
        drop-shadow(0 3px 3px #000)
        drop-shadow(0 0 10px rgba(255,255,255,.7));
}

.pointer::after {
    content: "";

    position: absolute;

    left: -10px;
    top: -53px;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: #ff3f66;

    box-shadow:
        0 0 10px #ff3f66;
}

/* ==========================================
   КНОПКА
========================================== */

.spin-button {
    width: min(440px, 90%);
    margin-top: 35px;

    padding: 18px 25px;

    border: none;
    border-radius: 16px;

    background:
        linear-gradient(
            90deg,
            #00ffe1,
            #64ffd0
        );

    color: #06100f;

    font-size: 20px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 10px 35px rgba(0,255,220,.22);

    transition: .2s;
}

.spin-button:hover {
    transform: translateY(-3px) scale(1.02);

    box-shadow:
        0 15px 45px rgba(0,255,220,.4);
}

.spin-button:active {
    transform: scale(.98);
}

.spin-button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

/* ==========================================
   РЕЗУЛЬТАТ
========================================== */

.result {
    width: min(580px, 94%);
    margin-top: 22px;

    padding: 22px;

    border-radius: 20px;

    background: rgba(15,18,35,.9);

    border: 1px solid rgba(255,255,255,.08);

    text-align: center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);
}

.result-title {
    color: #858ba5;

    font-size: 13px;
    font-weight: 900;

    letter-spacing: 1px;
}

.result-name {
    margin-top: 9px;

    font-size: clamp(23px, 5vw, 34px);

    font-weight: 900;
}

.result-description {
    margin-top: 8px;

    color: #aeb4ca;

    font-size: 15px;
}

.result-pop {
    animation: resultPop .45s ease;
}

@keyframes resultPop {

    0% {
        transform: scale(.8);
        opacity: .2;
    }

    70% {
        transform: scale(1.04);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* ==========================================
   ПАНЕЛЬ
========================================== */

.panel {
    padding: 22px;

    border-radius: 22px;

    background: rgba(15,18,35,.9);

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);
}

.panel h2 {
    margin: 0 0 15px;

    font-size: 20px;
}

.stats {
    display: grid;
    gap: 9px;

    margin-bottom: 25px;
}

.stat {
    display: flex;
    justify-content: space-between;

    padding: 12px;

    border-radius: 11px;

    background:
        rgba(255,255,255,.045);
}

.stat-value {
    color: #00ffe1;
    font-weight: 900;
}

.history {
    max-height: 300px;
    overflow-y: auto;
}

.history-item {
    padding: 11px;

    margin-bottom: 7px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.045);

    font-size: 14px;
}

.empty {
    padding: 20px;

    text-align: center;

    color: #737990;
}

.small-button {
    width: 100%;

    margin-top: 12px;

    padding: 11px;

    border-radius: 10px;

    border:
        1px solid rgba(255,255,255,.1);

    background: transparent;

    color: #aeb3c7;

    cursor: pointer;
}

.small-button:hover {
    background:
        rgba(255,255,255,.05);

    color: white;
}

/* ==========================================
   КОНФЕТТИ
========================================== */

#confetti {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 999;
}

.confetti {
    position: fixed;

    width: 8px;
    height: 14px;

    animation:
        confettiFall 2.5s linear forwards;
}

@keyframes confettiFall {

    from {
        transform:
            translateY(-30px)
            rotate(0deg);

        opacity: 1;
    }

    to {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 850px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .panel {
        width: min(580px, 94%);
        margin: auto;
    }
}

@media (max-width: 520px) {

    header {
        padding-top: 22px;
    }

    .wheel-box {
        width: 96vw;
    }

    .pointer {
        border-left-width: 18px;
        border-right-width: 18px;
        border-top-width: 45px;
    }

    .pointer::after {
        width: 15px;
        height: 15px;

        left: -7.5px;
        top: -41px;
    }

    .spin-button {
        font-size: 17px;
        padding: 16px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🎰 БУСТИКИ ОТ САЛЮШИНА
    </div>

    <div class="subtitle">
        Испытай удачу — крути рулетку сколько хочешь
    </div>

</header>


<div class="layout">

<section class="game">

    <div class="wheel-box">

        <div class="pointer"></div>

        <canvas id="wheelCanvas"></canvas>

    </div>


    <button
        id="spinButton"
        class="spin-button"
        onclick="spinWheel()">

        КРУТИТЬ РУЛЕТКУ

    </button>


    <div id="result" class="result">

        <div class="result-title">
            РЕЗУЛЬТАТ
        </div>

        <div class="result-name">
            🎰 Крути рулетку!
        </div>

        <div class="result-description">
            Удачи!
        </div>

    </div>

</section>


<aside class="panel">

    <h2>📊 Статистика</h2>

    <div class="stats">

        <div class="stat">
            <span>Всего вращений</span>
            <span
                class="stat-value"
                id="total">
                0
            </span>
        </div>

        <div class="stat">
            <span>❌ Не возвращаю</span>
            <span
                class="stat-value"
                id="noReturn">
                0
            </span>
        </div>

        <div class="stat">
            <span>↩️ Возвращаю</span>
            <span
                class="stat-value"
                id="returns">
                0
            </span>
        </div>

        <div class="stat">
            <span>🎁 Выигрышей</span>
            <span
                class="stat-value"
                id="wins">
                0
            </span>
        </div>

    </div>


    <h2>
        🕘 Последние вращения
    </h2>


    <div
        id="history"
        class="history">

        <div class="empty">
            Пока нет вращений
        </div>

    </div>


    <button
        class="small-button"
        id="soundButton"
        onclick="toggleSound()">

        🔊 Звук: ВКЛ

    </button>


    <button
        class="small-button"
        onclick="resetStats()">

        🗑️ Сбросить статистику

    </button>

</aside>

</div>


<div id="confetti"></div>


<script>

/* =====================================================
   НАСТРОЙКИ
===================================================== */

const canvas =
    document.getElementById("wheelCanvas");

const ctx =
    canvas.getContext("2d");


/*
    12 секторов.

    Текст рисуется Canvas-ом отдельно.
    Поэтому он НЕ поворачивается вместе
    с геометрией сектора.
*/

const sectors = [

    {
        name: "НЕ ВОЗВРАЩАЮ",
        lines: ["НЕ", "ВОЗВРАЩАЮ"],
        icon: "❌",
        type: "lose"
    },

    {
        name: "ВОЗВРАЩАЮ БЕЗ ПРИЗА",
        lines: ["ВОЗВРАЩАЮ", "БЕЗ ПРИЗА"],
        icon: "↩",
        type: "return"
    },

    {
        name: "НЕ ВОЗВРАЩАЮ",
        lines: ["НЕ", "ВОЗВРАЩАЮ"],
        icon: "❌",
        type: "lose"
    },

    {
        name: "ВОЗВРАЩАЮ БЕЗ ПРИЗА",
        lines: ["ВОЗВРАЩАЮ", "БЕЗ ПРИЗА"],
        icon: "↩",
        type: "return"
    },

    {
        name: "НЕ ВОЗВРАЩАЮ",
        lines: ["НЕ", "ВОЗВРАЩАЮ"],
        icon: "❌",
        type: "lose"
    },

    {
        name: "ВОЗВРАЩАЮ БЕЗ ПРИЗА",
        lines: ["ВОЗВРАЩАЮ", "БЕЗ ПРИЗА"],
        icon: "↩",
        type: "return"
    },

    {
        name: "НЕ ВОЗВРАЩАЮ",
        lines: ["НЕ", "ВОЗВРАЩАЮ"],
        icon: "❌",
        type: "lose"
    },

    {
        name: "ВОЗВРАЩАЮ БЕЗ ПРИЗА",
        lines: ["ВОЗВРАЩАЮ", "БЕЗ ПРИЗА"],
        icon: "↩",
        type: "return"
    },

    {
        name: "МАЛЕНЬКИЙ ВЫИГРЫШ",
        lines: ["МАЛЕНЬКИЙ", "ВЫИГРЫШ"],
        icon: "★",
        type: "win"
    },

    {
        name: "ХОРОШИЙ ВЫИГРЫШ",
        lines: ["ХОРОШИЙ", "ВЫИГРЫШ"],
        icon: "◆",
        type: "win"
    },

    {
        name: "РЕДКИЙ ПРИЗ",
        lines: ["РЕДКИЙ", "ПРИЗ"],
        icon: "★",
        type: "rare"
    },

    {
        name: "СУПЕР ПРИЗ",
        lines: ["СУПЕР", "ПРИЗ"],
        icon: "★",
        type: "jackpot"
    }

];


const descriptions = {

    "НЕ ВОЗВРАЩАЮ":
        "Сегодня без возврата 😈",

    "ВОЗВРАЩАЮ БЕЗ ПРИЗА":
        "Возвращаю, но без приза 😅",

    "МАЛЕНЬКИЙ ВЫИГРЫШ":
        "Неплохо! Маленький выигрыш!",

    "ХОРОШИЙ ВЫИГРЫШ":
        "Поздравляем! Хороший выигрыш!",

    "РЕДКИЙ ПРИЗ":
        "ОГО! Редкий приз 🔥",

    "СУПЕР ПРИЗ":
        "ДЖЕКПОТ! Супер приз 👑"

};


/* =====================================================
   ПЕРЕМЕННЫЕ
===================================================== */

let currentRotation = 0;

let isSpinning = false;

let soundEnabled = true;

let stats = {
    total: 0,
    noReturn: 0,
    returns: 0,
    wins: 0
};

let history = [];


/* =====================================================
   CANVAS RESIZE
===================================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawWheel();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   DRAW WHEEL
===================================================== */

function drawWheel() {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;

    const size =
        Math.min(width, height);

    const centerX =
        width / 2;

    const centerY =
        height / 2;

    const radius =
        size / 2 - 12;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Внешнее свечение
    */

    ctx.save();

    ctx.shadowColor =
        "rgba(0,255,220,.3)";

    ctx.shadowBlur = 30;


    /*
        Белая внешняя рамка
    */

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius + 5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();

    ctx.restore();


    /*
        Начальный угол.

        -90 градусов = верх.

        Сектор 0 будет начинаться
        на -105 градусов и заканчиваться
        на -75 градусов.

        Поэтому его центр находится
        ровно сверху.
    */

    const startOffset =
        -Math.PI / 2 -
        (Math.PI * 2 / sectors.length) / 2;


    const sectorAngle =
        Math.PI * 2 / sectors.length;


    /*
        Рисуем сектора
    */

    for (
        let i = 0;
        i < sectors.length;
        i++
    ) {

        const start =
            startOffset +
            i * sectorAngle +
            currentRotation;

        const end =
            start +
            sectorAngle;


        /*
            Цвета
        */

        const item =
            sectors[i];

        let color;

        if (item.type === "lose") {
            color =
                i % 2 === 0
                    ? "#252a45"
                    : "#1b2038";
        }

        else if (item.type === "return") {
            color =
                i % 2 === 0
                    ? "#27314c"
                    : "#1d263f";
        }

        else if (item.type === "win") {
            color =
                i % 2 === 0
                    ? "#244f50"
                    : "#1c3e40";
        }

        else if (item.type === "rare") {
            color =
                "#533c24";
        }

        else {
            color =
                "#542546";
        }


        /*
            Сектор
        */

        ctx.beginPath();

        ctx.moveTo(
            centerX,
            centerY
        );

        ctx.arc(
            centerX,
            centerY,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            color;

        ctx.fill();


        /*
            Белая граница между секторами
        */

        ctx.beginPath();

        ctx.moveTo(
            centerX,
            centerY
        );

        ctx.lineTo(
            centerX +
            Math.cos(start) * radius,
            centerY +
            Math.sin(start) * radius
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.28)";

        ctx.lineWidth = 2;

        ctx.stroke();
    }


    /*
        Рисуем ТЕКСТ.

        Это самое главное.

        Текст располагается по радиусу,
        но сам текст НЕ поворачивается.

        Поэтому он всегда читается нормально.
    */

    for (
        let i = 0;
        i < sectors.length;
        i++
    ) {

        const item =
            sectors[i];


        /*
            Центр сектора
        */

        const angle =
            startOffset +
            i * sectorAngle +
            sectorAngle / 2 +
            currentRotation;


        /*
            Положение текста.

            Немного ближе к внешнему краю,
            но достаточно далеко от границ.
        */

        const textRadius =
            radius * 0.66;


        const x =
            centerX +
            Math.cos(angle) *
            textRadius;


        const y =
            centerY +
            Math.sin(angle) *
            textRadius;


        /*
            Текст всегда горизонтальный.
        */

        ctx.save();

        ctx.translate(
            x,
            y
        );

        /*
            НЕ поворачиваем canvas.
        */

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        /*
            Размер шрифта зависит
            от размера колеса.
        */

        const fontSize =
            Math.max(
                11,
                Math.min(
                    18,
                    radius * 0.07
                )
            );


        ctx.font =
            `900 ${fontSize}px Arial, Helvetica, sans-serif`;


        /*
            Тень для читаемости
        */

        ctx.shadowColor =
            "rgba(0,0,0,.95)";

        ctx.shadowBlur = 5;

        ctx.shadowOffsetX = 0;

        ctx.shadowOffsetY = 2;


        /*
            Цвет текста
        */

        if (
            item.type === "jackpot"
        ) {

            ctx.fillStyle =
                "#ffe77a";

        } else if (
            item.type === "rare"
        ) {

            ctx.fillStyle =
                "#ffd28a";

        } else if (
            item.type === "win"
        ) {

            ctx.fillStyle =
                "#aaffee";

        } else {

            ctx.fillStyle =
                "#ffffff";
        }


        /*
            Значок
        */

        ctx.font =
            `900 ${fontSize * .85}px Arial`;

        ctx.fillText(
            item.icon,
            0,
            -fontSize * 1.45
        );


        /*
            Первая строка
        */

        ctx.font =
            `900 ${fontSize}px Arial, Helvetica, sans-serif`;

        ctx.fillText(
            item.lines[0],
            0,
            0
        );


        /*
            Вторая строка
        */

        ctx.fillText(
            item.lines[1],
            0,
            fontSize * 1.25
        );


        ctx.restore();
    }


    /*
        Центральный круг.
    */

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius * 0.19,
        0,
        Math.PI * 2
    );

    const centerGradient =
        ctx.createLinearGradient(
            centerX - 50,
            centerY - 50,
            centerX + 50,
            centerY + 50
        );

    centerGradient.addColorStop(
        0,
        "#00ffe1"
    );

    centerGradient.addColorStop(
        1,
        "#7054ff"
    );

    ctx.fillStyle =
        centerGradient;

    ctx.fill();


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 6;

    ctx.stroke();


    /*
        Центральная надпись
    */

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        `900 ${Math.max(16, radius * .08)}px Arial`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.shadowColor =
        "rgba(0,0,0,.5)";

    ctx.shadowBlur = 5;

    ctx.fillText(
        "🎰",
        centerX,
        centerY
    );


    /*
        Внешняя рамка
    */

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth = 4;

    ctx.stroke();
}


/* =====================================================
   ВЕРОЯТНОСТИ
===================================================== */

function getRandomResult() {

    const random =
        Math.random() * 100;


    /*
        55%
    */

    if (random < 55) {

        return "НЕ ВОЗВРАЩАЮ";
    }


    /*
        40%
    */

    if (random < 95) {

        return "ВОЗВРАЩАЮ БЕЗ ПРИЗА";
    }


    /*
        3%
    */

    if (random < 98) {

        return "МАЛЕНЬКИЙ ВЫИГРЫШ";
    }


    /*
        1.5%
    */

    if (random < 99.5) {

        return "ХОРОШИЙ ВЫИГРЫШ";
    }


    /*
        0.45%
    */

    if (random < 99.95) {

        return "РЕДКИЙ ПРИЗ";
    }


    /*
        0.05%
    */

    return "СУПЕР ПРИЗ";
}


/* =====================================================
   НАЙТИ СЕКТОР
===================================================== */

function getSectorForResult(result) {

    const available = [];

    for (
        let i = 0;
        i < sectors.length;
        i++
    ) {

        if (
            sectors[i].name === result
        ) {

            available.push(i);
        }
    }


    return available[
        Math.floor(
            Math.random() *
            available.length
        )
    ];
}


/* =====================================================
   ВРАЩЕНИЕ
===================================================== */

function spinWheel() {

    if (isSpinning) {
        return;
    }


    isSpinning = true;


    const button =
        document.getElementById(
            "spinButton"
        );


    button.disabled = true;

    button.textContent =
        "ВРАЩЕНИЕ...";


    /*
        Сначала определяем результат.
    */

    const result =
        getRandomResult();


    /*
        Потом выбираем конкретный
        сектор с этим результатом.
    */

    const sectorIndex =
        getSectorForResult(
            result
        );


    /*
        Размер одного сектора.
    */

    const sectorSize =
        360 / sectors.length;


    /*
        Центр выбранного сектора.

        Сектор 0 находится сверху.
    */

    const targetAngle =
        sectorIndex *
        sectorSize;


    /*
        Текущий угол нормализуем.
    */

    const current =
        ((currentRotation % 360) + 360) % 360;


    /*
        Нужно повернуть колесо так,
        чтобы выбранный сектор оказался
        точно под указателем сверху.
    */

    let difference =
        -targetAngle - current;


    while (
        difference < 0
    ) {

        difference += 360;
    }


    /*
        Дополнительные обороты.
    */

    const extraSpins =
        5 +
        Math.floor(
            Math.random() * 3
        );


    const finalRotation =
        currentRotation +
        extraSpins * 360 +
        difference;


    currentRotation =
        finalRotation;


    /*
        Запускаем анимацию.

        Canvas каждый кадр будет
        перерисовываться с новым углом.
    */

    animateWheel(
        finalRotation,
        5800,
        result
    );


    playSpinSound();
}


/* =====================================================
   CANVAS ANIMATION
===================================================== */

function animateWheel(
    targetRotation,
    duration,
    result
) {

    const startRotation =
        currentRotation;


    /*
        Нам нужно анимировать
        от старого угла к новому.
    */

    /*
        Исправляем:

        currentRotation уже содержит target.

        Поэтому вычисляем начальное
        положение через разницу.
    */

    const difference =
        targetRotation -
        startRotation;


    /*
        В реальности стартовый угол
        должен быть target - difference.
    */

    const start =
        targetRotation -
        difference;


    const startTime =
        performance.now();


    function frame(now) {

        const elapsed =
            now - startTime;


        let progress =
            elapsed / duration;


        if (progress > 1) {
            progress = 1;
        }


        /*
            Очень плавное замедление.
        */

        const eased =
            1 -
            Math.pow(
                1 - progress,
                4
            );


        /*
            Текущий угол.
        */

        currentRotation =
            start +
            difference * eased;


        drawWheel();


        if (progress < 1) {

            requestAnimationFrame(
                frame
            );

        } else {

            /*
                Гарантируем абсолютно
                точный финальный угол.
            */

            currentRotation =
                targetRotation;

            drawWheel();


            setTimeout(() => {

                finishSpin(result);

            }, 100);
        }
    }


    /*
        Здесь нужно начать
        с предыдущего положения.

        Поэтому временно сохраняем
        старое значение.
    */

    const oldRotation =
        targetRotation -
        difference;


    currentRotation =
        oldRotation;

    drawWheel();


    requestAnimationFrame(frame);
}


/* =====================================================
   ЗАВЕРШЕНИЕ
===================================================== */

function finishSpin(result) {

    showResult(result);

    updateStats(result);

    addHistory(result);

    saveData();


    const type =
        sectors.find(
            item => item.name === result
        ).type;


    if (
        type === "win" ||
        type === "rare" ||
        type === "jackpot"
    ) {

        createConfetti(
            type === "jackpot"
                ? 120
                : 50
        );

        playWinSound();
    }


    const button =
        document.getElementById(
            "spinButton"
        );


    button.disabled = false;

    button.textContent =
        "КРУТИТЬ РУЛЕТКУ";


    isSpinning = false;
}


/* =====================================================
   РЕЗУЛЬТАТ
===================================================== */

function showResult(result) {

    const item =
        sectors.find(
            sector =>
                sector.name === result
        );


    const box =
        document.getElementById(
            "result"
        );


    box.classList.remove(
        "result-pop"
    );


    void box.offsetWidth;


    box.classList.add(
        "result-pop"
    );


    box.innerHTML = `

        <div class="result-title">
            ТЕБЕ ВЫПАЛО
        </div>

        <div class="result-name">
            ${item.icon}
            ${result}
        </div>

        <div class="result-description">
            ${descriptions[result]}
        </div>

    `;
}


/* =====================================================
   СТАТИСТИКА
===================================================== */

function updateStats(result) {

    stats.total++;


    if (
        result === "НЕ ВОЗВРАЩАЮ"
    ) {

        stats.noReturn++;

    } else if (
        result === "ВОЗВРАЩАЮ БЕЗ ПРИЗА"
    ) {

        stats.returns++;

    } else {

        stats.wins++;
    }


    renderStats();
}


function renderStats() {

    document.getElementById(
        "total"
    ).textContent =
        stats.total;


    document.getElementById(
        "noReturn"
    ).textContent =
        stats.noReturn;


    document.getElementById(
        "returns"
    ).textContent =
        stats.returns;


    document.getElementById(
        "wins"
    ).textContent =
        stats.wins;
}


/* =====================================================
   ИСТОРИЯ
===================================================== */

function addHistory(result) {

    history.unshift(result);


    if (
        history.length > 10
    ) {

        history.pop();
    }


    renderHistory();
}


function renderHistory() {

    const box =
        document.getElementById(
            "history"
        );


    if (
        history.length === 0
    ) {

        box.innerHTML =
            `<div class="empty">
                Пока нет вращений
            </div>`;

        return;
    }


    box.innerHTML = "";


    history.forEach(
        (result, index) => {

            const item =
                sectors.find(
                    sector =>
                        sector.name === result
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.textContent =
                `${index + 1}. ${item.icon} ${result}`;


            box.appendChild(div);
        }
    );
}


/* =====================================================
   LOCAL STORAGE
===================================================== */

function saveData() {

    localStorage.setItem(
        "boostiki_stats",
        JSON.stringify(stats)
    );


    localStorage.setItem(
        "boostiki_history",
        JSON.stringify(history)
    );


    localStorage.setItem(
        "boostiki_sound",
        JSON.stringify(soundEnabled)
    );
}


function loadData() {

    try {

        const savedStats =
            localStorage.getItem(
                "boostiki_stats"
            );


        const savedHistory =
            localStorage.getItem(
                "boostiki_history"
            );


        const savedSound =
            localStorage.getItem(
                "boostiki_sound"
            );


        if (savedStats) {

            stats =
                JSON.parse(
                    savedStats
                );
        }


        if (savedHistory) {

            history =
                JSON.parse(
                    savedHistory
                );
        }


        if (savedSound !== null) {

            soundEnabled =
                JSON.parse(
                    savedSound
                );
        }

    } catch (error) {

        console.log(
            "Ошибка загрузки",
            error
        );
    }


    renderStats();

    renderHistory();

    updateSoundButton();
}


/* =====================================================
   СБРОС
===================================================== */

function resetStats() {

    const answer =
        confirm(
            "Точно сбросить статистику?"
        );


    if (!answer) {
        return;
    }


    stats = {
        total: 0,
        noReturn: 0,
        returns: 0,
        wins: 0
    };


    history = [];


    localStorage.removeItem(
        "boostiki_stats"
    );


    localStorage.removeItem(
        "boostiki_history"
    );


    renderStats();

    renderHistory();
}


/* =====================================================
   ЗВУК
===================================================== */

let audioContext = null;


function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    return audioContext;
}


function tone(
    frequency,
    duration,
    volume
) {

    if (!soundEnabled) {
        return;
    }


    try {

        const audio =
            getAudioContext();


        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            volume,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime +
            duration
        );


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();


        oscillator.stop(
            audio.currentTime +
            duration
        );

    } catch (error) {}
}


function playSpinSound() {

    if (!soundEnabled) {
        return;
    }


    let ticks = 0;


    const interval =
        setInterval(() => {

            if (!isSpinning) {

                clearInterval(
                    interval
                );

                return;
            }


            tone(
                180 + ticks * 6,
                .045,
                .025
            );


            ticks++;

        }, 130);
}


function playWinSound() {

    if (!soundEnabled) {
        return;
    }


    tone(
        523,
        .12,
        .05
    );


    setTimeout(() => {

        tone(
            659,
            .12,
            .05
        );

    }, 130);


    setTimeout(() => {

        tone(
            784,
            .25,
            .06
        );

    }, 260);
}


function toggleSound() {

    soundEnabled =
        !soundEnabled;


    updateSoundButton();

    saveData();
}


function updateSoundButton() {

    const button =
        document.getElementById(
            "soundButton"
        );


    button.textContent =
        soundEnabled
            ? "🔊 Звук: ВКЛ"
            : "🔇 Звук: ВЫКЛ";
}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(amount) {

    const container =
        document.getElementById(
            "confetti"
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() *
            100 +
            "vw";


        piece.style.background =
            `hsl(
                ${Math.random() * 360},
                90%,
                60%
            )`;


        piece.style.animationDuration =
            1.5 +
            Math.random() * 2 +
            "s";


        container.appendChild(
            piece
        );


        setTimeout(() => {

            piece.remove();

        }, 4000);
    }
}


/* =====================================================
   ПЕРВЫЙ ЗАПУСК
===================================================== */

loadData();

resizeCanvas();

</script>
