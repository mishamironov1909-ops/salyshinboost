<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бустики от Салюшина 🎰</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 10%, #16334a, transparent 30%),
        radial-gradient(circle at 80% 80%, #32194d, transparent 35%),
        #070912;
}

header {
    text-align: center;
    padding: 30px 15px 10px;
}

.logo {
    font-size: clamp(28px, 6vw, 50px);
    font-weight: 900;
    background: linear-gradient(
        90deg,
        #00ffe1,
        #6c75ff,
        #ff4fd8
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.subtitle {
    margin-top: 8px;
    color: #aeb5ca;
}

.layout {
    width: min(1150px, 94%);
    margin: 25px auto 50px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 30px;
}

.game {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ===============================
   КОЛЕСО
================================ */

.wheel-box {
    position: relative;
    width: min(580px, 94vw);
    aspect-ratio: 1;
}

#wheel {
    width: 100%;
    height: 100%;
    display: block;
}

.pointer {
    position: absolute;
    z-index: 10;

    top: -3px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-top: 58px solid white;

    filter:
        drop-shadow(0 3px 4px #000)
        drop-shadow(0 0 10px rgba(255,255,255,.7));
}

.pointer::after {
    content: "";

    position: absolute;

    left: -9px;
    top: -53px;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #ff3e65;
}

/* ===============================
   КНОПКА
================================ */

#spinButton {
    width: min(440px, 90%);

    margin-top: 35px;
    padding: 18px;

    border: 0;
    border-radius: 16px;

    background:
        linear-gradient(
            90deg,
            #00ffe1,
            #63ffd0
        );

    color: #06100f;

    font-size: 20px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 10px 35px rgba(0,255,220,.25);

    transition: .2s;
}

#spinButton:hover {
    transform: translateY(-3px) scale(1.02);
}

#spinButton:active {
    transform: scale(.98);
}

#spinButton:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

/* ===============================
   РЕЗУЛЬТАТ
================================ */

.result {
    width: min(580px, 94%);

    margin-top: 22px;
    padding: 22px;

    text-align: center;

    border-radius: 20px;

    background: rgba(15,18,35,.92);
    border: 1px solid rgba(255,255,255,.08);
}

.result-title {
    color: #858ba5;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
}

.result-name {
    margin-top: 8px;

    font-size: clamp(23px, 5vw, 34px);
    font-weight: 900;
}

.result-description {
    margin-top: 8px;
    color: #afb5ca;
}

.pop {
    animation: pop .45s ease;
}

@keyframes pop {
    0% {
        transform: scale(.8);
        opacity: .2;
    }

    70% {
        transform: scale(1.04);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* ===============================
   ПАНЕЛЬ
================================ */

.panel {
    padding: 22px;

    border-radius: 22px;

    background: rgba(15,18,35,.92);
    border: 1px solid rgba(255,255,255,.08);
}

.panel h2 {
    margin: 0 0 15px;
}

.stats {
    display: grid;
    gap: 9px;

    margin-bottom: 25px;
}

.stat {
    display: flex;
    justify-content: space-between;

    padding: 12px;

    border-radius: 11px;

    background: rgba(255,255,255,.045);
}

.stat-value {
    color: #00ffe1;
    font-weight: 900;
}

.history {
    max-height: 300px;
    overflow-y: auto;
}

.history-item {
    padding: 11px;
    margin-bottom: 7px;

    border-radius: 10px;

    background: rgba(255,255,255,.045);

    font-size: 14px;
}

.empty {
    padding: 20px;

    text-align: center;

    color: #737990;
}

.small-button {
    width: 100%;

    margin-top: 12px;
    padding: 11px;

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,.1);

    background: transparent;

    color: #aeb3c7;

    cursor: pointer;
}

.small-button:hover {
    background: rgba(255,255,255,.05);
    color: white;
}

/* ===============================
   CONFETTI
================================ */

#confetti {
    position: fixed;
    inset: 0;

    pointer-events: none;
    z-index: 999;
}

.confetti {
    position: fixed;

    width: 8px;
    height: 14px;

    animation: fall 2.5s linear forwards;
}

@keyframes fall {
    from {
        transform:
            translateY(-30px)
            rotate(0deg);

        opacity: 1;
    }

    to {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}

@media (max-width: 850px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .panel {
        width: min(580px, 94%);
        margin: auto;
    }
}

@media (max-width: 520px) {

    .pointer {
        border-left-width: 18px;
        border-right-width: 18px;
        border-top-width: 45px;
    }

    #spinButton {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🎰 БУСТИКИ ОТ САЛЮШИНА
    </div>

    <div class="subtitle">
        Крути рулетку сколько хочешь
    </div>

</header>


<div class="layout">

    <section class="game">

        <div class="wheel-box">

            <div class="pointer"></div>

            <canvas id="wheel"></canvas>

        </div>


        <button
            id="spinButton"
            onclick="spinWheel()">

            КРУТИТЬ РУЛЕТКУ

        </button>


        <div
            class="result"
            id="result">

            <div class="result-title">
                РЕЗУЛЬТАТ
            </div>

            <div class="result-name">
                🎰 Крути рулетку!
            </div>

            <div class="result-description">
                Удачи!
            </div>

        </div>

    </section>


    <aside class="panel">

        <h2>📊 Статистика</h2>

        <div class="stats">

            <div class="stat">
                <span>Всего вращений</span>
                <span
                    class="stat-value"
                    id="total">
                    0
                </span>
            </div>

            <div class="stat">
                <span>❌ Не возвращаю</span>
                <span
                    class="stat-value"
                    id="noReturn">
                    0
                </span>
            </div>

            <div class="stat">
                <span>↩️ Возвращаю</span>
                <span
                    class="stat-value"
                    id="returns">
                    0
                </span>
            </div>

            <div class="stat">
                <span>🎁 Выигрышей</span>
                <span
                    class="stat-value"
                    id="wins">
                    0
                </span>
            </div>

        </div>


        <h2>🕘 История</h2>

        <div
            class="history"
            id="history">

            <div class="empty">
                Пока нет вращений
            </div>

        </div>


        <button
            class="small-button"
            id="soundButton"
            onclick="toggleSound()">

            🔊 Звук: ВКЛ

        </button>


        <button
            class="small-button"
            onclick="resetStats()">

            🗑️ Сбросить статистику

        </button>

    </aside>

</div>


<div id="confetti"></div>


<script>

/* ==================================================
   НАСТРОЙКИ
================================================== */

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");


/*
    Порядок секторов на колесе.
*/

const sectors = [

    {
        name: "НЕ ВОЗВРАЩАЮ",
        lines: ["НЕ", "ВОЗВРАЩАЮ"],
        icon: "❌",
        type: "lose"
    },

    {
        name: "ВОЗВРАЩАЮ БЕЗ ПРИЗА",
        lines: ["ВОЗВРАЩАЮ", "БЕЗ ПРИЗА"],
        icon: "↩",
        type: "return"
    },

    {
        name: "НЕ ВОЗВРАЩАЮ",
        lines: ["НЕ", "ВОЗВРАЩАЮ"],
        icon: "❌",
        type: "lose"
    },

    {
        name: "ВОЗВРАЩАЮ БЕЗ ПРИЗА",
        lines: ["ВОЗВРАЩАЮ", "БЕЗ ПРИЗА"],
        icon: "↩",
        type: "return"
    },

    {
        name: "НЕ ВОЗВРАЩАЮ",
        lines: ["НЕ", "ВОЗВРАЩАЮ"],
        icon: "❌",
        type: "lose"
    },

    {
        name: "ВОЗВРАЩАЮ БЕЗ ПРИЗА",
        lines: ["ВОЗВРАЩАЮ", "БЕЗ ПРИЗА"],
        icon: "↩",
        type: "return"
    },

    {
        name: "НЕ ВОЗВРАЩАЮ",
        lines: ["НЕ", "ВОЗВРАЩАЮ"],
        icon: "❌",
        type: "lose"
    },

    {
        name: "ВОЗВРАЩАЮ БЕЗ ПРИЗА",
        lines: ["ВОЗВРАЩАЮ", "БЕЗ ПРИЗА"],
        icon: "↩",
        type: "return"
    },

    {
        name: "МАЛЕНЬКИЙ ВЫИГРЫШ",
        lines: ["МАЛЕНЬКИЙ", "ВЫИГРЫШ"],
        icon: "★",
        type: "win"
    },

    {
        name: "ХОРОШИЙ ВЫИГРЫШ",
        lines: ["ХОРОШИЙ", "ВЫИГРЫШ"],
        icon: "◆",
        type: "win"
    },

    {
        name: "РЕДКИЙ ПРИЗ",
        lines: ["РЕДКИЙ", "ПРИЗ"],
        icon: "★",
        type: "rare"
    },

    {
        name: "СУПЕР ПРИЗ",
        lines: ["СУПЕР", "ПРИЗ"],
        icon: "★",
        type: "jackpot"
    }

];


const descriptions = {

    "НЕ ВОЗВРАЩАЮ":
        "Сегодня без возврата 😈",

    "ВОЗВРАЩАЮ БЕЗ ПРИЗА":
        "Возвращаю, но без приза 😅",

    "МАЛЕНЬКИЙ ВЫИГРЫШ":
        "Неплохо! Маленький выигрыш!",

    "ХОРОШИЙ ВЫИГРЫШ":
        "Поздравляем! Хороший выигрыш!",

    "РЕДКИЙ ПРИЗ":
        "ОГО! Редкий приз 🔥",

    "СУПЕР ПРИЗ":
        "ДЖЕКПОТ! 👑"

};


/* ==================================================
   СОСТОЯНИЕ
================================================== */

let rotation = 0;
let isSpinning = false;
let soundEnabled = true;

let stats = {
    total: 0,
    noReturn: 0,
    returns: 0,
    wins: 0
};

let history = [];


/* ==================================================
   CANVAS
================================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawWheel();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==================================================
   РИСОВАНИЕ
================================================== */

function drawWheel() {

    const w =
        canvas.clientWidth;

    const h =
        canvas.clientHeight;

    const cx =
        w / 2;

    const cy =
        h / 2;

    const radius =
        Math.min(w, h) / 2 - 10;


    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    /*
        Внешнее свечение.
    */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius + 5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#fff";

    ctx.shadowColor =
        "rgba(0,255,220,.35)";

    ctx.shadowBlur = 25;

    ctx.fill();

    ctx.restore();


    const slice =
        Math.PI * 2 / sectors.length;


    /*
        Сектор №0 находится сверху.
    */

    const base =
        -Math.PI / 2 -
        slice / 2;


    /* -------------------------------
       СЕКТОРА
    -------------------------------- */

    sectors.forEach(
        (item, index) => {

            const start =
                base +
                index * slice +
                rotation;

            const end =
                start + slice;


            let color;


            if (
                item.type === "lose"
            ) {

                color =
                    index % 2 === 0
                        ? "#252b47"
                        : "#171d36";

            }

            else if (
                item.type === "return"
            ) {

                color =
                    index % 2 === 0
                        ? "#2d3855"
                        : "#202b46";

            }

            else if (
                item.type === "win"
            ) {

                color =
                    index % 2 === 0
                        ? "#235050"
                        : "#1c3e40";

            }

            else if (
                item.type === "rare"
            ) {

                color =
                    "#59401f";

            }

            else {

                color =
                    "#5b2449";
            }


            ctx.beginPath();

            ctx.moveTo(
                cx,
                cy
            );

            ctx.arc(
                cx,
                cy,
                radius,
                start,
                end
            );

            ctx.closePath();

            ctx.fillStyle =
                color;

            ctx.fill();


            /*
                Линия сектора.
            */

            ctx.beginPath();

            ctx.moveTo(
                cx,
                cy
            );

            ctx.lineTo(
                cx +
                Math.cos(start) * radius,

                cy +
                Math.sin(start) * radius
            );

            ctx.strokeStyle =
                "rgba(255,255,255,.28)";

            ctx.lineWidth = 2;

            ctx.stroke();
        }
    );


    /* -------------------------------
       ТЕКСТ
    -------------------------------- */

    sectors.forEach(
        (item, index) => {

            const angle =
                base +
                index * slice +
                slice / 2 +
                rotation;


            /*
                Расстояние от центра.

                Именно здесь располагается текст.
            */

            const textRadius =
                radius * .66;


            const x =
                cx +
                Math.cos(angle) *
                textRadius;


            const y =
                cy +
                Math.sin(angle) *
                textRadius;


            ctx.save();


            ctx.translate(
                x,
                y
            );


            /*
                ВАЖНО:

                Никакого rotate().

                Текст всегда горизонтальный.
            */

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";


            const fontSize =
                Math.max(
                    10,
                    Math.min(
                        17,
                        radius * .065
                    )
                );


            /*
                Тень.
            */

            ctx.shadowColor =
                "rgba(0,0,0,.95)";

            ctx.shadowBlur = 5;

            ctx.shadowOffsetY = 2;


            if (
                item.type === "jackpot"
            ) {

                ctx.fillStyle =
                    "#ffe36e";

            }

            else if (
                item.type === "rare"
            ) {

                ctx.fillStyle =
                    "#ffd18a";

            }

            else if (
                item.type === "win"
            ) {

                ctx.fillStyle =
                    "#9effec";

            }

            else {

                ctx.fillStyle =
                    "#ffffff";
            }


            /*
                Иконка.
            */

            ctx.font =
                `900 ${fontSize * .85}px Arial`;

            ctx.fillText(
                item.icon,
                0,
                -fontSize * 1.5
            );


            /*
                Первая строка.
            */

            ctx.font =
                `900 ${fontSize}px Arial`;

            ctx.fillText(
                item.lines[0],
                0,
                0
            );


            /*
                Вторая строка.
            */

            ctx.fillText(
                item.lines[1],
                0,
                fontSize * 1.25
            );


            ctx.restore();
        }
    );


    /* -------------------------------
       ЦЕНТР
    -------------------------------- */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius * .19,
        0,
        Math.PI * 2
    );


    const gradient =
        ctx.createLinearGradient(
            cx - 50,
            cy - 50,
            cx + 50,
            cy + 50
        );


    gradient.addColorStop(
        0,
        "#00ffe1"
    );

    gradient.addColorStop(
        1,
        "#7255ff"
    );


    ctx.fillStyle =
        gradient;

    ctx.fill();


    ctx.strokeStyle =
        "#fff";

    ctx.lineWidth = 6;

    ctx.stroke();


    ctx.shadowColor =
        "rgba(0,0,0,.6)";

    ctx.shadowBlur = 5;

    ctx.fillStyle =
        "#fff";

    ctx.font =
        `900 ${Math.max(
            18,
            radius * .08
        )}px Arial`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "🎰",
        cx,
        cy
    );


    /*
        Внешняя рамка.
    */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "#fff";

    ctx.lineWidth = 4;

    ctx.stroke();
}


/* ==================================================
   ВЫБОР РЕЗУЛЬТАТА
================================================== */

function getRandomResult() {

    const random =
        Math.random() * 100;


    /*
        Чаще всего:
        НЕ ВОЗВРАЩАЮ
    */

    if (random < 55) {

        return "НЕ ВОЗВРАЩАЮ";
    }


    /*
        Второй частый результат:
        ВОЗВРАЩАЮ БЕЗ ПРИЗА
    */

    if (random < 95) {

        return "ВОЗВРАЩАЮ БЕЗ ПРИЗА";
    }


    if (random < 98) {

        return "МАЛЕНЬКИЙ ВЫИГРЫШ";
    }


    if (random < 99.5) {

        return "ХОРОШИЙ ВЫИГРЫШ";
    }


    if (random < 99.95) {

        return "РЕДКИЙ ПРИЗ";
    }


    return "СУПЕР ПРИЗ";
}


/* ==================================================
   ПОИСК СЕКТОРА
================================================== */

function findSector(result) {

    const indexes = [];


    sectors.forEach(
        (sector, index) => {

            if (
                sector.name === result
            ) {

                indexes.push(index);
            }
        }
    );


    return indexes[
        Math.floor(
            Math.random() *
            indexes.length
        )
    ];
}


/* ==================================================
   КРУТКА
================================================== */

function spinWheel() {

    if (isSpinning) {
        return;
    }


    isSpinning = true;


    const button =
        document.getElementById(
            "spinButton"
        );


    button.disabled = true;

    button.textContent =
        "🎰 КРУТИТСЯ...";


    /*
        Получаем результат.
    */

    const result =
        getRandomResult();


    /*
        Получаем сектор,
        который соответствует результату.
    */

    const sectorIndex =
        findSector(result);


    const slice =
        360 / sectors.length;


    /*
        Текущий угол.
    */

    const startRotation =
        rotation;


    /*
        Угол, при котором центр
        выбранного сектора окажется
        точно под указателем.
    */

    const currentDegrees =
        rotation * 180 / Math.PI;


    const normalized =
        (
            currentDegrees % 360 +
            360
        ) % 360;


    /*
        Центр сектора относительно верха.
    */

    const targetDegrees =
        sectorIndex * slice;


    let difference =
        -targetDegrees -
        normalized;


    while (
        difference < 0
    ) {

        difference += 360;
    }


    /*
        6-8 полных оборотов.
    */

    const extraSpins =
        6 +
        Math.floor(
            Math.random() * 3
        );


    const targetRotation =
        startRotation +
        (
            extraSpins * 360 +
            difference
        ) *
        Math.PI / 180;


    /*
        Запускаем анимацию.
    */

    animateRotation(
        startRotation,
        targetRotation,
        5800,
        result
    );


    playSpinSound();
}


/* ==================================================
   АНИМАЦИЯ — ИСПРАВЛЕННАЯ
================================================== */

function animateRotation(
    start,
    target,
    duration,
    result
) {

    const startTime =
        performance.now();


    function animate(now) {

        const elapsed =
            now - startTime;


        let progress =
            elapsed / duration;


        if (
            progress >= 1
        ) {

            progress = 1;
        }


        /*
            Плавное замедление.

            В начале быстро,
            в конце медленно.
        */

        const eased =
            1 -
            Math.pow(
                1 - progress,
                4
            );


        /*
            ВОТ ЗДЕСЬ реально
            меняется угол Canvas.
        */

        rotation =
            start +
            (
                target - start
            ) *
            eased;


        drawWheel();


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        } else {

            /*
                Точное конечное положение.
            */

            rotation =
                target;

            drawWheel();


            finishSpin(
                result
            );
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* ==================================================
   ЗАВЕРШЕНИЕ
================================================== */

function finishSpin(result) {

    showResult(result);

    updateStats(result);

    addHistory(result);

    saveData();


    const sector =
        sectors.find(
            item =>
                item.name === result
        );


    if (
        sector.type === "win" ||
        sector.type === "rare" ||
        sector.type === "jackpot"
    ) {

        createConfetti(
            sector.type === "jackpot"
                ? 120
                : 50
        );

        playWinSound();
    }


    const button =
        document.getElementById(
            "spinButton"
        );


    button.disabled = false;

    button.textContent =
        "КРУТИТЬ РУЛЕТКУ";


    isSpinning = false;
}


/* ==================================================
   РЕЗУЛЬТАТ
================================================== */

function showResult(result) {

    const sector =
        sectors.find(
            item =>
                item.name === result
        );


    const resultBox =
        document.getElementById(
            "result"
        );


    resultBox.classList.remove(
        "pop"
    );


    void resultBox.offsetWidth;


    resultBox.classList.add(
        "pop"
    );


    resultBox.innerHTML = `

        <div class="result-title">
            ТЕБЕ ВЫПАЛО
        </div>

        <div class="result-name">
            ${sector.icon}
            ${result}
        </div>

        <div class="result-description">
            ${descriptions[result]}
        </div>

    `;
}


/* ==================================================
   СТАТИСТИКА
================================================== */

function updateStats(result) {

    stats.total++;


    if (
        result === "НЕ ВОЗВРАЩАЮ"
    ) {

        stats.noReturn++;

    } else if (
        result === "ВОЗВРАЩАЮ БЕЗ ПРИЗА"
    ) {

        stats.returns++;

    } else {

        stats.wins++;
    }


    renderStats();
}


function renderStats() {

    document.getElementById(
        "total"
    ).textContent =
        stats.total;


    document.getElementById(
        "noReturn"
    ).textContent =
        stats.noReturn;


    document.getElementById(
        "returns"
    ).textContent =
        stats.returns;


    document.getElementById(
        "wins"
    ).textContent =
        stats.wins;
}


/* ==================================================
   ИСТОРИЯ
================================================== */

function addHistory(result) {

    history.unshift(result);


    if (
        history.length > 10
    ) {

        history.pop();
    }


    renderHistory();
}


function renderHistory() {

    const box =
        document.getElementById(
            "history"
        );


    if (
        history.length === 0
    ) {

        box.innerHTML =
            `<div class="empty">
                Пока нет вращений
            </div>`;

        return;
    }


    box.innerHTML = "";


    history.forEach(
        (result, index) => {

            const sector =
                sectors.find(
                    item =>
                        item.name === result
                );


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "history-item";


            element.textContent =
                `${index + 1}. ${sector.icon} ${result}`;


            box.appendChild(
                element
            );
        }
    );
}


/* ==================================================
   СОХРАНЕНИЕ
================================================== */

function saveData() {

    localStorage.setItem(
        "boostiki_stats",
        JSON.stringify(stats)
    );


    localStorage.setItem(
        "boostiki_history",
        JSON.stringify(history)
    );


    localStorage.setItem(
        "boostiki_sound",
        JSON.stringify(soundEnabled)
    );
}


function loadData() {

    try {

        const savedStats =
            localStorage.getItem(
                "boostiki_stats"
            );


        const savedHistory =
            localStorage.getItem(
                "boostiki_history"
            );


        const savedSound =
            localStorage.getItem(
                "boostiki_sound"
            );


        if (savedStats) {

            stats =
                JSON.parse(
                    savedStats
                );
        }


        if (savedHistory) {

            history =
                JSON.parse(
                    savedHistory
                );
        }


        if (
            savedSound !== null
        ) {

            soundEnabled =
                JSON.parse(
                    savedSound
                );
        }

    } catch (error) {

        console.error(error);
    }


    renderStats();

    renderHistory();

    updateSoundButton();
}


/* ==================================================
   СБРОС
================================================== */

function resetStats() {

    if (
        !confirm(
            "Сбросить статистику?"
        )
    ) {

        return;
    }


    stats = {
        total: 0,
        noReturn: 0,
        returns: 0,
        wins: 0
    };


    history = [];


    localStorage.removeItem(
        "boostiki_stats"
    );


    localStorage.removeItem(
        "boostiki_history"
    );


    renderStats();

    renderHistory();
}


/* ==================================================
   ЗВУК
================================================== */

let audioContext = null;


function getAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    return audioContext;
}


function tone(
    frequency,
    duration,
    volume
) {

    if (!soundEnabled) {
        return;
    }


    try {

        const audio =
            getAudio();


        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            volume,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime +
            duration
        );


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();


        oscillator.stop(
            audio.currentTime +
            duration
        );

    } catch (e) {}
}


function playSpinSound() {

    if (!soundEnabled) {
        return;
    }


    let ticks = 0;


    const interval =
        setInterval(
            () => {

                if (!isSpinning) {

                    clearInterval(
                        interval
                    );

                    return;
                }


                tone(
                    180 +
                    ticks * 5,
                    .04,
                    .025
                );


                ticks++;

            },
            130
        );
}


function playWinSound() {

    if (!soundEnabled) {
        return;
    }


    tone(
        523,
        .12,
        .05
    );


    setTimeout(
        () => tone(
            659,
            .12,
            .05
        ),
        130
    );


    setTimeout(
        () => tone(
            784,
            .25,
            .06
        ),
        260
    );
}


function toggleSound() {

    soundEnabled =
        !soundEnabled;


    updateSoundButton();

    saveData();
}


function updateSoundButton() {

    document.getElementById(
        "soundButton"
    ).textContent =
        soundEnabled
            ? "🔊 Звук: ВКЛ"
            : "🔇 Звук: ВЫКЛ";
}


/* ==================================================
   КОНФЕТТИ
================================================== */

function createConfetti(amount) {

    const container =
        document.getElementById(
            "confetti"
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 +
            "vw";


        piece.style.background =
            `hsl(
                ${Math.random() * 360},
                90%,
                60%
            )`;


        piece.style.animationDuration =
            1.5 +
            Math.random() * 2 +
            "s";


        container.appendChild(
            piece
        );


        setTimeout(
            () => piece.remove(),
            4000
        );
    }
}


/* ==================================================
   ЗАПУСК
================================================== */

loadData();

resizeCanvas();

</script>
